services:
  database:
    image: postgres
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "psql", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
  auth-api:
    build: ./auth-api/
    depends_on:
      - "database"
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - INTERNAL_SERVICE_ENDPOINT=${INTERNAL_SERVICE_ENDPOINT}
  data-api:
    build: ./data-api/
    depends_on:
      - "database"
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
